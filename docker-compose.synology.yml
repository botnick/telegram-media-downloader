services:
  telegram-downloader:
    image: ghcr.io/botnick/telegram-media-downloader:latest
    pull_policy: always
    container_name: telegram-downloader
    restart: unless-stopped
    ports:
      - "${TGDL_PORT:-3000}:3000"
    volumes:
      - /volume3/Downloads/telegram-media-downloader/data:/app/data
    devices:
      - /dev/dri:/dev/dri
    environment:
      - TZ=${TZ:-UTC}
      - PORT=3000
      - TGDL_DATA_DIR=/app/data
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
      - "autoheal=true"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: ${TGDL_MEM_LIMIT:-2g}
        reservations:
          memory: 256m
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"
        compress: "true"

  autoheal:
    image: willfarrell/autoheal:1.2.0
    container_name: telegram-downloader-autoheal
    restart: unless-stopped
    network_mode: none
    environment:
      - AUTOHEAL_CONTAINER_LABEL=autoheal
      - AUTOHEAL_INTERVAL=30
      - AUTOHEAL_START_PERIOD=60
      - AUTOHEAL_DEFAULT_STOP_TIMEOUT=10
      - TZ=${TZ:-UTC}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
