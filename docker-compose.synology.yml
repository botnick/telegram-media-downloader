# Synology (DSM Container Manager). Adjust the /volume… path to your share.
# /dev/dri passes the iGPU through; the entrypoint joins its group itself.
services:
  telegram-downloader:
    # Prebuilt multi-arch image; `pull_policy: always` makes
    # `docker compose up -d` pick up each new release. To build from source
    # instead, replace these two lines with `build: .`.
    image: ghcr.io/botnick/telegram-media-downloader:latest
    pull_policy: always
    container_name: telegram-downloader
    restart: unless-stopped
    stop_grace_period: 60s
    ports:
      # Container always listens on 3000; change the host side in .env.
      - "${TGDL_PORT:-3000}:3000"
    volumes:
      - /volume3/Downloads/telegram-media-downloader/data:/app/data
      # Split-disk setup: mount the media disk and set TGDL_DOWNLOADS_DIR.
      # - /mnt/hdd/downloads:/mnt/hdd/downloads
    devices:
      - /dev/dri:/dev/dri
    environment:
      - TZ=${TZ:-UTC}
      - TGDL_DOWNLOADS_DIR=${TGDL_DOWNLOADS_DIR:-}
      # Trust one reverse-proxy hop (Caddy / Traefik / nginx). Set to an
      # empty value when the dashboard is exposed directly.
      - TRUST_PROXY=${TRUST_PROXY:-1}
      - TGDL_SECURE_COOKIES=${TGDL_SECURE_COOKIES:-0}
      # One-click "Install update" via the watchtower service below. The app
      # generates the token in ./data/watchtower/; .env can override it.
      - WATCHTOWER_URL=${WATCHTOWER_URL:-http://watchtower:8080}
      - WATCHTOWER_HTTP_API_TOKEN=${WATCHTOWER_HTTP_API_TOKEN:-}
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
      # The autoheal service restarts the container if it stops answering.
      - "autoheal=true"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: ${TGDL_MEM_LIMIT:-2g}
        reservations:
          memory: 256m
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
        compress: "true"

  autoheal:
    image: willfarrell/autoheal:latest
    container_name: telegram-downloader-autoheal
    restart: unless-stopped
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    # Needs only the docker socket, no network.
    network_mode: none
    environment:
      - AUTOHEAL_CONTAINER_LABEL=autoheal
      - AUTOHEAL_INTERVAL=30
      - AUTOHEAL_START_PERIOD=60
      - AUTOHEAL_DEFAULT_STOP_TIMEOUT=60
      - TZ=${TZ:-UTC}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    logging:
      driver: "json-file"
      options:
        max-size: "1m"
        max-file: "3"

  # Updater behind Settings → Maintenance → "Install update". It touches only
  # containers with the watchtower label (all four here, itself included) and
  # the dashboard never sees the docker socket. Automatic updates: set
  # WATCHTOWER_HTTP_API_PERIODIC_POLLS=true in .env (schedule below, 6-field
  # cron in the container TZ; default daily 04:00).
  watchtower:
    image: nickfedor/watchtower:latest
    container_name: telegram-downloader-updater
    restart: unless-stopped
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # Only the generated token folder, never the DB/sessions.
      - /volume3/Downloads/telegram-media-downloader/data/watchtower:/run/tgdl:ro
    depends_on:
      telegram-downloader:
        condition: service_healthy
    environment:
      - WATCHTOWER_HTTP_API_ENDPOINTS=update
      - WATCHTOWER_HTTP_API_TOKEN=${WATCHTOWER_HTTP_API_TOKEN:-/run/tgdl/api-token}
      - WATCHTOWER_HTTP_API_PERIODIC_POLLS=${WATCHTOWER_HTTP_API_PERIODIC_POLLS:-false}
      - WATCHTOWER_SCHEDULE=${WATCHTOWER_SCHEDULE:-0 0 4 * * *}
      - WATCHTOWER_LABEL_ENABLE=true
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_INCLUDE_RESTARTING=true
      - WATCHTOWER_NO_STARTUP_MESSAGE=true
      - TZ=${TZ:-UTC}
