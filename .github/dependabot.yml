version: 2
updates:
  - package-ecosystem: gomod
    directory: "/core-service"
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      go-dependencies:
        update-types: ["minor", "patch"]

  # Docker base image — patch only.
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # GitHub Actions — quarterly is plenty for refs like @v4 → @v5.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      actions:
        patterns: ["*"]
