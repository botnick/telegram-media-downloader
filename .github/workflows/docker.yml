name: Docker

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
      - name: Build candidate locally
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          push: false
          tags: tgdl-smoke:candidate
          build-args: |
            GIT_SHA=${{ github.sha }}
            BUILT_AT=${{ github.event.head_commit.timestamp || github.event.pull_request.updated_at }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify native runtime
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --entrypoint=sh tgdl-smoke:candidate -ec '
            test -x /usr/local/bin/tgdl-server
            for command in npm npx; do
              if command -v "$command" >/dev/null 2>&1; then exit 1; fi
            done
            # `node` is only the 2.x compose compatibility shim, never a runtime.
            if node --version >/dev/null 2>&1; then exit 1; fi
            /usr/local/bin/tgdl-server version
          '
          trap 'docker rm -f tgdl-smoke tgdl-smoke-2x >/dev/null 2>&1 || true' EXIT
          docker run -d --name tgdl-smoke tgdl-smoke:candidate
          # A 2.x Synology compose overrides the command and healthcheck.
          docker run -d --name tgdl-smoke-2x --health-cmd 'node scripts/healthcheck.js' --health-interval 2s tgdl-smoke:candidate node src/web/server.js
          for attempt in $(seq 1 30); do
            if docker exec tgdl-smoke wget -qO- http://127.0.0.1:3000/health; then
              # The server drops root in the entrypoint and runs as uid 1000.
              test "$(docker exec tgdl-smoke sh -c 'stat -c %u /proc/$(pidof tgdl-server)')" = 1000
              for wait in $(seq 1 20); do
                test "$(docker inspect --format '{{.State.Health.Status}}' tgdl-smoke-2x)" = healthy && break
                sleep 1
              done
              test "$(docker inspect --format '{{.State.Health.Status}}' tgdl-smoke-2x)" = healthy
              docker exec tgdl-smoke wget -qO- http://127.0.0.1:3000/setup-needed.html >/dev/null
              printf '%s\n' 'ci-setup-fixture-password' | docker exec -i -u node tgdl-smoke tgdl-server setup --password-stdin
              docker stop --time 60 tgdl-smoke >/dev/null
              test "$(docker inspect --format '{{.State.ExitCode}}' tgdl-smoke)" = 0
              exit 0
            fi
            sleep 1
          done
          docker logs tgdl-smoke
          exit 1
      - name: Cross-build arm64 binary stage
        run: |
          docker buildx build --platform linux/arm64 --target binaries -o type=local,dest=/tmp/tgdl-arm64 .
          file /tmp/tgdl-arm64/tgdl-server | grep -q 'ARM aarch64'
      - uses: docker/setup-qemu-action@v4
      - name: Publish verified source
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GIT_SHA=${{ github.sha }}
            BUILT_AT=${{ github.event.head_commit.timestamp || github.event.pull_request.updated_at }}
          cache-from: type=gha
