name: Release native server

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: core-service/go.mod
          cache-dependency-path: core-service/go.sum
      - name: Verify Go application
        run: |
          go -C core-service vet ./...
          go -C core-service test ./...
      - name: Build release archives
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: RELEASE_VERSION=${RELEASE_TAG#v} ./scripts/build-server-release.sh
      - name: Verify archive and checksums
        run: |
          mkdir -p /tmp/tgdl-release-smoke
          tar -xzf core-service/dist/tgdl-server-${GITHUB_REF_NAME}-linux-amd64.tar.gz -C /tmp/tgdl-release-smoke
          /tmp/tgdl-release-smoke/tgdl-server version | grep -F "tgdl-server ${GITHUB_REF_NAME#v} "
          (cd core-service/dist && sha256sum -c SHA256SUMS)
      - name: Release notes from CHANGELOG.md
        run: |
          # The section for this tag, without the service-worker bookkeeping.
          awk -v v="${GITHUB_REF_NAME#v}" '
            index($0, "## [" v "]") == 1 { on = 1; next }
            on && /^## \[/ { exit }
            on && /^### Service worker/ { skip = 1; next }
            on && /^### / { skip = 0 }
            on && !skip { print }
          ' CHANGELOG.md > release-notes.md
          test -s release-notes.md || echo "See [CHANGELOG.md](https://github.com/${GITHUB_REPOSITORY}/blob/main/CHANGELOG.md)." > release-notes.md
          cat release-notes.md
      - uses: softprops/action-gh-release@v3
        with:
          body_path: release-notes.md
          files: |
            core-service/dist/tgdl-server-*.tar.gz
            core-service/dist/SHA256SUMS
          fail_on_unmatched_files: true
