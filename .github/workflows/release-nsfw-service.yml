# Release pipeline for the nsfw-service sidecar.
#
# Triggered by an `nsfw-v*` tag push — independent from the app's `v*`
# tags, like the faces and seekbar sidecars.
#
#   1. release    — GitHub Release for the tag, notes taken from the
#                   matching section of nsfw-service/CHANGELOG.md.
#   2. image-cpu  — ghcr.io/botnick/tgdl-nsfw:<version> + :latest
#                   (linux/amd64 + linux/arm64, CPU-only PyTorch).
#   3. image-gpu  — ghcr.io/botnick/tgdl-nsfw:gpu-<version> + :gpu-latest
#                   (linux/amd64, CUDA runtime).
name: release-nsfw-service

on:
  push:
    tags:
      - 'nsfw-v*'

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -e
          VERSION="${TAG#nsfw-v}"
          # Section between "## [VERSION]" and the next "## [" heading.
          awk -v v="## [${VERSION}]" '
            index($0, v) == 1 { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' nsfw-service/CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "nsfw-service/CHANGELOG.md has no section for ${VERSION}" >&2
            exit 1
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --notes-file notes.md
          else
            gh release create "$TAG" --title "nsfw-service v${VERSION}" \
              --notes-file notes.md --latest=false
          fi

  image-cpu:
    name: image (cpu, linux/amd64 + linux/arm64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build + push
        uses: docker/build-push-action@v7
        with:
          context: ./nsfw-service
          file: ./nsfw-service/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/botnick/tgdl-nsfw:${{ github.ref_name }}
            ghcr.io/botnick/tgdl-nsfw:latest
          cache-from: type=gha,scope=nsfw-cpu
          cache-to: type=gha,mode=max,scope=nsfw-cpu

  image-gpu:
    name: image (gpu, linux/amd64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The CUDA base + PyTorch wheels don't fit in the runner's default
      # free space.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build + push
        uses: docker/build-push-action@v7
        with:
          context: ./nsfw-service
          file: ./nsfw-service/Dockerfile.gpu
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/botnick/tgdl-nsfw:gpu-${{ github.ref_name }}
            ghcr.io/botnick/tgdl-nsfw:gpu-latest
