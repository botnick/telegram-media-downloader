# Release pipeline for tgdl-core, the Go companion process (core-service/).
#
# Triggered by a `core-v*` tag push — independent from the app's semver
# tags. Ship `core-v<X.Y.Z>` BEFORE an app release whose
# `CORE_VERSION` (src/core/gocore/spawn.js) points at it, so bare-metal
# installs never look for assets that don't exist yet. (Docker images
# compile tgdl-core themselves and don't use these assets.)
#
# Every target is cross-compiled with CGO off on one runner by
# `npm run build:core -- --release`, the same script developers run:
#
#   tgdl-core-<slug>.tar.gz   one `tgdl-core` / `tgdl-core.exe` inside
#   SHA256SUMS                sha256sum format; spawn.js refuses a tarball
#                             that doesn't match it
#
# spawn.js downloads
#   https://github.com/botnick/telegram-media-downloader/releases/download/core-v<VER>/tgdl-core-<slug>.tar.gz

name: release-core-service

on:
  push:
    tags:
      - 'core-v*'

permissions:
  contents: write

jobs:
  release:
    name: build + publish tgdl-core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.25'
          cache: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Tag matches CORE_VERSION
        shell: bash
        run: |
          want="core-v$(node -e "import('./src/core/gocore/spawn.js').then(m => console.log(m.CORE_VERSION))")"
          if [ "$want" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match CORE_VERSION ($want) in src/core/gocore/spawn.js"
            exit 1
          fi

      - name: Vet + test
        working-directory: core-service
        run: |
          go vet ./...
          go test ./...

      - name: Build all targets
        run: node scripts/build-core.js --release

      - name: Smoke-run the linux-x64 build
        shell: bash
        run: |
          set -e
          mkdir -p /tmp/smoke && tar -xzf core-service/dist/tgdl-core-linux-x64.tar.gz -C /tmp/smoke
          /tmp/smoke/tgdl-core version
          /tmp/smoke/tgdl-core version | grep -q " ${GITHUB_REF_NAME#core-v} "
          echo abc > /tmp/smoke/abc.txt
          /tmp/smoke/tgdl-core hash /tmp/smoke/abc.txt | grep -q '^edeaaff3f1774ad2888673770c6d64097e391bc362d7d6fb34982ddf0efd18cb '
          (cd core-service/dist && sha256sum -c SHA256SUMS)
          ls -lh core-service/dist

      - name: Attach to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            core-service/dist/tgdl-core-*.tar.gz
            core-service/dist/SHA256SUMS
          # Component releases must never become the repo's "Latest"
          # release — that slot belongs to the app (vX.Y.Z tags).
          make_latest: false
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
