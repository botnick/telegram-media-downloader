name: Site refresh

# Keeps the website current without anyone touching it:
#   - a published release rebuilds GitHub Pages, so the version, release card
#     and structured data on the site show the new release (the release
#     workflow starts this one: a release created with the workflow token
#     sends no release event);
#   - after every site build, the sitemap URLs are sent to IndexNow (Bing,
#     Yandex, Seznam, Naver), so search engines recrawl changed pages.

on:
  push:
    branches: [main]
    paths: ['docs/**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write

concurrency:
  group: site-refresh
  cancel-in-progress: true

env:
  SITE: https://botnick.github.io/telegram-media-downloader
  INDEXNOW_KEY: a354c13810270ce3e6ce79e85781f161

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Rebuild Pages for the release
        if: github.event_name != 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" --silent

      # GitHub's own Pages builder is sometimes slow (25 minutes on
      # 2026-11-04, against about one minute normally). Slowness on its side
      # is only a warning; a build that errors is still a failure.
      - name: Wait for the Pages build
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
          STARTED: ${{ github.event.head_commit.timestamp }}
        run: |
          started=$(date -d "${STARTED:-now}" +%s)
          for _ in $(seq 135); do
            sleep 20
            read -r status created < <(gh api "repos/${{ github.repository }}/pages/builds/latest" --jq '.status + " " + .created_at') || continue
            echo "latest build: $status $created"
            if [ "$status" = built ] && [ "$(date -d "$created" +%s)" -ge "$((started - 60))" ]; then echo "built=true" >> "$GITHUB_OUTPUT"; exit 0; fi
            if [ "$status" = errored ]; then echo "::error::Pages build failed"; exit 1; fi
          done
          echo "::warning::GitHub Pages was still building after 45 minutes; skipping IndexNow this time"

      - name: Send the sitemap to IndexNow
        if: steps.pages.outputs.built == 'true'
        run: |
          urls=$(curl -fsSL "$SITE/sitemap.xml" | grep -o '<loc>[^<]*</loc>' | sed 's/<[^>]*>//g' | jq -R . | jq -s .)
          echo "$urls" | jq -r 'length | "\(.) URLs"'
          body=$(jq -n --argjson urls "$urls" --arg key "$INDEXNOW_KEY" --arg site "$SITE" \
            '{host: "botnick.github.io", key: $key, keyLocation: ($site + "/" + $key + ".txt"), urlList: $urls}')
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST https://api.indexnow.org/indexnow \
            -H 'Content-Type: application/json; charset=utf-8' -d "$body")
          echo "IndexNow answered $code"
          case "$code" in 200|202) ;; *) echo "::error::IndexNow answered $code"; exit 1 ;; esac
