# Pure-Go production service. The image contains one tgdl-server process and
# the embedded browser bundle; no Node sidecar or runtime fallback is used.
services:
  telegram-downloader:
    image: telegram-media-downloader:go-local
    build:
      context: .
    pull_policy: never
    container_name: telegram-downloader
    user: "${TGDL_UID:-1000}:${TGDL_GID:-1000}"
    restart: unless-stopped
    stop_grace_period: 60s
    ports:
      - "${TGDL_PORT:-3000}:3000"
    volumes:
      - type: bind
        source: ./data
        target: /app/data
        bind:
          create_host_path: false
    environment:
      - TZ=${TZ:-UTC}
      - PORT=3000
      - TGDL_DATA_DIR=/app/data
      # A defined empty TRUST_PROXY disables forwarded-header trust.
      - TRUST_PROXY=${TRUST_PROXY-loopback}
      - TGDL_SECURE_COOKIES=${TGDL_SECURE_COOKIES:-0}
      - TGDL_CSP=${TGDL_CSP:-}
      - COMPRESSION_LEVEL=${COMPRESSION_LEVEL:-6}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"
        compress: "true"
