- q: Telegram Media Downloader คืออะไร?
  a: โปรแกรมฟรีแบบโอเพนซอร์ส (MIT) ที่ติดตั้งบนคอม เซิร์ฟเวอร์ หรือ NAS ของคุณเอง ใช้โหลดรูป วิดีโอ ไฟล์ ข้อความเสียง และ Stories จากช่อง กลุ่ม และแชต Telegram โดยล็อกอินด้วยบัญชี Telegram ของคุณ จึงโหลดจากช่องส่วนตัวที่คุณเป็นสมาชิกได้ด้วย รันเป็นโปรแกรม Go ไฟล์เดียว (`tgdl-server`) หรือ Docker image และจัดการผ่านหน้าเว็บ
- q: ใช้ฟรีไหม?
  a: ฟรี เป็นโอเพนซอร์สสัญญาอนุญาต MIT ไม่มีแบบเสียเงิน ไม่ต้องสมัครบัญชีหรือใช้บริการคลาวด์ใดๆ แค่ขอ `apiId` และ `apiHash` ฟรีจาก [my.telegram.org](https://my.telegram.org)
- q: จะโหลดรูปและวิดีโอทั้งหมดจากช่อง Telegram ได้ยังไง?
  a: เพิ่มบัญชี Telegram ของคุณ (Settings > Accounts) เปิดหน้า Chats เลือกช่องที่ต้องการ แล้วสั่งดึงย้อนหลัง (backfill) เลือกจำนวนข้อความที่จะอ่าน หรือใส่ 0 เพื่อเอาทั้งหมด หน้าคิวจะแสดงทุกไฟล์พร้อมความคืบหน้า ความเร็ว และเวลาที่เหลือ ถ้าอยากให้โหลดของใหม่ต่อไปเรื่อยๆ ให้เปิดการเฝ้าแชตแบบเรียลไทม์ไว้
- q: โหลดจากช่องหรือกลุ่มส่วนตัว (private) ได้ไหม?
  a: ได้ ถ้าบัญชี Telegram ที่ใช้ล็อกอินเป็นสมาชิกอยู่ โปรแกรมทำงานในนามบัญชีนั้นผ่าน user API ของ Telegram (MTProto) จึงเห็นทุกอย่างที่คุณเห็นในแอป Telegram
- q: ต่างจากบอท Telegram ยังไง?
  a: บอทใช้ Bot API ซึ่งจำกัดขนาดไฟล์และเห็นแค่แชตที่บอทถูกเชิญเข้าไป โปรแกรมนี้ล็อกอินด้วยบัญชีผู้ใช้ของคุณผ่าน MTProto จึงไม่มีเพดานขนาดไฟล์แบบบอท และเห็นแชตทั้งหมดของคุณ
- q: ต้องติดตั้ง Node.js หรือ Go ไหม?
  a: ไม่ต้อง ตั้งแต่ 3.0 ทั้งแอปเป็นไฟล์ Go ไฟล์เดียวชื่อ `tgdl-server` ที่มีหน้าแดชบอร์ดในตัว ใช้ Docker image หรือดาวน์โหลดไฟล์จากหน้า release สำหรับ Linux, Windows หรือ macOS ได้เลย ต้องมี Go เฉพาะตอน build เองจากซอร์สโค้ด
- q: session ของ Telegram ปลอดภัยไหม?
  a: session ถูกเข้ารหัสเก็บไว้ใน `data/sessions/` โดยมีกุญแจอยู่ที่ `data/secret.key` ไม่มีข้อมูลถูกส่งไปยังบริการของโปรเจกต์นี้ แดชบอร์ดจะไม่เปิดให้ใครเข้าจนกว่าจะตั้งรหัสผ่าน ถ้าเปิดออกอินเทอร์เน็ตให้ใช้ HTTPS และสำรองไฟล์ `secret.key` ไว้ เพราะถ้าหายต้องล็อกอิน Telegram ใหม่ ดู[นโยบายความปลอดภัย](https://github.com/botnick/telegram-media-downloader/blob/main/SECURITY.md)
- q: บัญชีจะโดนแบนไหม?
  a: โปรแกรมใช้ user API แบบเดียวกับแอป Telegram แต่การโหลดอัตโนมัติปริมาณมากมีความเสี่ยงเสมอ การโหลดที่ล้มเหลวจะลองใหม่โดยเว้นระยะนานขึ้นเรื่อยๆ และเคารพ FloodWait ของ Telegram ให้อัตโนมัติ แนะนำให้ตั้งจำนวนโหลดพร้อมกันและความเร็วไว้พอประมาณ และอย่ารันหลายบัญชีจาก IP เดียว ไม่มีเครื่องมือไหนรับประกันได้ว่าไม่มีความเสี่ยงเลย
- q: รันบน Raspberry Pi หรือ Synology NAS ได้ไหม?
  a: ได้ Docker image มีทั้ง amd64 และ arm64 ไฟล์ release รองรับ ARM 32 บิต (`linux-arm`) ด้วย และใน repo มี `docker-compose.synology.yml` ให้ ดู[คู่มือติดตั้ง](https://botnick.github.io/telegram-media-downloader/DEPLOY.html)
- q: โหลด Stories หรือลิงก์ t.me ทีละข้อความได้ไหม?
  a: ได้ ค้น Stories ของผู้ใช้จาก username แล้วเลือกเก็บได้ หรือวางลิงก์ `t.me/...` ลงในแดชบอร์ด รองรับลิงก์ช่อง กลุ่ม forum topic และลิงก์แชตส่วนตัว
- q: อัปเกรดจาก 2.x เป็น 3.x ยังไง?
  a: ไม่ต้องเปลี่ยนอะไร กด Install update ใน Settings > Maintenance หรือรัน `docker compose pull && docker compose up -d` image, พอร์ต, โฟลเดอร์ข้อมูล, รหัสผ่าน และบัญชี Telegram ใช้ต่อได้ทั้งหมด ดู[การอัปเกรดจาก 2.x](https://botnick.github.io/telegram-media-downloader/UPGRADING.html)
- q: ไฟล์เก็บไว้ที่ไหน และสำรองข้อมูลได้ไหม?
  a: ไฟล์ที่โหลดอยู่ใน `data/downloads/<chat>/` หรือย้ายไปดิสก์อื่นด้วย `TGDL_DOWNLOADS_DIR` สำรองข้อมูลไปที่โฟลเดอร์ในเครื่อง, S3, SFTP, FTP/FTPS, Google Drive หรือ Dropbox ได้ เลือกเข้ารหัสได้ และมีคำสั่งกู้คืนแบบออฟไลน์ ดู[คู่มือสำรองข้อมูล](https://botnick.github.io/telegram-media-downloader/BACKUP.html)
