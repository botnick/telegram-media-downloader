{%- if site.keywords %}
<meta name="keywords" content="{{ site.keywords | strip | escape }}">
{%- endif %}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "SoftwareApplication",
  "name": {{ site.title | jsonify }},
  "description": {{ site.description | strip | jsonify }},
  "applicationCategory": "MultimediaApplication",
  "operatingSystem": "Linux, Windows, macOS, Docker",
  "programmingLanguage": "Go",
  "featureList": "Realtime Telegram channel and group monitor, history backfill, t.me link and Stories downloads, duplicate skipping, web dashboard and PWA, backups to S3, SFTP and FTP, cluster mode",
  "license": {{ site.software.license | jsonify }},
  "downloadUrl": {{ site.software.repository | append: "/releases/latest" | jsonify }},
  "softwareVersion": {{ site.software.version | jsonify }},
  "codeRepository": {{ site.software.repository | jsonify }},
  "url": {{ site.url | append: site.baseurl | jsonify }},
  "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" }
}
</script>
